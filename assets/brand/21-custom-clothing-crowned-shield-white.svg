  <text x="600" y="1066" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="6">EST. 2021</text>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="6">
    <path d="M346 1058 H504 M696 1058 H854"/>
  </g>
</svg>
