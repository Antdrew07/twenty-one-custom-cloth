<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Twenty One Custom Clothing crowned shield logo</title>
  <desc id="desc">A black and white crowned shield featuring the number 21, Custom Clothing wordmark, and Established 2021 line.</desc>
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
    <!-- Crown -->
    <path d="M390 188 L432 130 L474 177 L510 91 L550 176 L600 116 L650 176 L690 91 L726 177 L768 130 L810 188 L790 237 H410 Z" stroke-width="22"/>
    <path d="M414 217 H786" stroke-width="16"/>
    <circle cx="432" cy="130" r="10" fill="#FFFFFF" stroke="none"/>
    <circle cx="510" cy="91" r="10" fill="#FFFFFF" stroke="none"/>
    <circle cx="600" cy="116" r="10" fill="#FFFFFF" stroke="none"/>
    <circle cx="690" cy="91" r="10" fill="#FFFFFF" stroke="none"/>
    <circle cx="768" cy="130" r="10" fill="#FFFFFF" stroke="none"/>
    <!-- Outer shield -->
    <path d="M336 248 Q468 218 600 248 Q732 218 864 248 V536 Q864 748 600 890 Q336 748 336 536 Z" stroke-width="26"/>
    <!-- Inner shield -->
    <path d="M375 281 Q487 257 600 283 Q713 257 825 281 V523 Q825 703 600 824 Q375 703 375 523 Z" stroke-width="12"/>
  </g>
  <!-- Numeral -->
  <text x="600" y="586" text-anchor="middle" fill="#FFFFFF" font-family="Bodoni Moda, Didot, Times New Roman, serif" font-size="328" font-weight="500" letter-spacing="-26">21</text>
  <!-- Dividers and ornament -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M424 676 H540 M660 676 H776" stroke-width="10"/>
    <path d="M600 650 v52 M577 676 h46" stroke-width="8"/>
    <path d="M600 657 C585 645 567 657 576 675 C582 688 600 700 600 700 C600 700 618 688 624 675 C633 657 615 645 600 657Z" fill="#FFFFFF" stroke="none"/>
  </g>
  <!-- Wordmark -->
  <text x="600" y="1007" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="18">CUSTOM CLOTHING</text>
  <text x="600" y="1067" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="6">EST. 2021</text>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="6">
    <path d="M336 1059 H505 M695 1059 H864"/>
  </g>
</svg>
