<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Twenty One Custom Clothing crowned shield logo</title>
  <desc id="desc">A black and white crowned shield featuring the number 21, Custom Clothing wordmark, and Established 2021 line.</desc>
  <!-- Crown and shield -->
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ornamental crown reconstructed from the approved garment-bag reference -->
    <path d="M472 286 Q600 252 728 286 L718 317 Q600 287 482 317 Z" stroke-width="13"/>
    <path d="M485 270 C478 233 490 195 521 170 C530 196 543 211 561 221 C552 190 560 158 584 137 C591 160 598 177 600 194 C602 177 609 160 616 137 C640 158 648 190 639 221 C657 211 670 196 679 170 C710 195 722 233 715 270" stroke-width="16"/>
    <!-- Fleur-de-lis terminals -->
    <path d="M521 170 C500 153 501 128 523 118 C526 136 536 145 550 148 C540 160 533 167 521 170 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M584 137 C562 121 564 96 586 84 C590 104 600 112 600 125 C600 112 610 104 614 84 C636 96 638 121 616 137 C609 144 604 150 600 158 C596 150 591 144 584 137 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M679 170 C667 167 660 160 650 148 C664 145 674 136 677 118 C699 128 700 153 679 170 Z" fill="#FFFFFF" stroke="none"/>
