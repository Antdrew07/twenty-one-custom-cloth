    <circle cx="508" cy="283" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="554" cy="277" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="600" cy="270" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="646" cy="277" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="692" cy="283" r="6" fill="#FFFFFF" stroke="none"/>
    <path d="M490 308 Q600 280 710 308" stroke-width="8"/>
    <!-- Outer shield -->
    <path d="M365 311 Q485 283 600 314 Q715 283 835 311 V558 Q835 745 600 887 Q365 745 365 558 Z" stroke-width="24"/>
    <!-- Inner shield -->
    <path d="M400 341 Q500 317 600 345 Q700 317 800 341 V549 Q800 705 600 829 Q400 705 400 549 Z" stroke-width="11"/>
  </g>
  <!-- Numeral -->
  <text x="600" y="602" text-anchor="middle" fill="#FFFFFF" font-family="Bodoni Moda, Didot, Times New Roman, serif" font-size="322" font-weight="500" letter-spacing="-26">21</text>
  <!-- Divider and small fleur ornament -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
