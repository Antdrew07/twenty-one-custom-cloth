<svg xmlns="http://www.w3.org/2000/svg" viewBox="260 55 680 850" role="img" aria-labelledby="title desc">
  <title id="title">Twenty One Custom Clothing crowned shield emblem</title>
  <desc id="desc">Crowned Twenty One shield emblem.</desc>
  <g color="#FFFFFF">

  <!-- Classical crown: a clear crown band, five jeweled points, and a royal center -->
  <g fill="currentColor" stroke="none">
    <path d="M442 318 L457 264 L476 178 L530 234 L562 118 L600 201 L638 118 L670 234 L724 178 L743 264 L758 318 Z"/>
    <path d="M449 304 Q600 270 751 304 L738 348 Q600 316 462 348 Z"/>
    <path d="M467 337 Q600 309 733 337 L720 363 Q600 336 480 363 Z"/>
    <!-- Rounded jewels make the points unmistakably crown-like at small sizes -->
    <circle cx="476" cy="178" r="15"/>
    <circle cx="530" cy="234" r="13"/>
    <circle cx="562" cy="118" r="16"/>
    <circle cx="600" cy="201" r="14"/>
    <circle cx="638" cy="118" r="16"/>
    <circle cx="670" cy="234" r="13"/>
    <circle cx="724" cy="178" r="15"/>
  </g>
  <!-- Crown highlights and jewel line -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M474 286 Q600 250 726 286" stroke-width="12"/>
    <circle cx="507" cy="326" r="7" fill="currentColor" stroke="none"/>
    <circle cx="553" cy="319" r="7" fill="currentColor" stroke="none"/>
    <circle cx="600" cy="313" r="7" fill="currentColor" stroke="none"/>
    <circle cx="647" cy="319" r="7" fill="currentColor" stroke="none"/>
    <circle cx="693" cy="326" r="7" fill="currentColor" stroke="none"/>
    <!-- Outer shield -->
    <path d="M365 346 Q485 318 600 349 Q715 318 835 346 V569 Q835 748 600 891 Q365 748 365 569 Z" stroke-width="24"/>
    <!-- Inner shield -->
    <path d="M400 375 Q500 351 600 379 Q700 351 800 375 V559 Q800 708 600 832 Q400 708 400 559 Z" stroke-width="11"/>
  </g>
  <!-- Numeral -->
  <text x="600" y="616" text-anchor="middle" fill="currentColor" font-family="Bodoni Moda, Didot, Times New Roman, serif" font-size="318" font-weight="500" letter-spacing="-26">21</text>
  <!-- Divider and small fleur ornament -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M444 691 H548 M652 691 H756" stroke-width="9"/>
    <path d="M600 666 v48 M578 691 h44" stroke-width="7"/>
    <path d="M600 671 C586 659 570 670 578 686 C584 698 600 710 600 710 C600 710 616 698 622 686 C630 670 614 659 600 671Z" fill="currentColor" stroke="none"/>
  </g>

  </g>
</svg>
